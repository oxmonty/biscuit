# Code generated by biscuit. DO NOT EDIT.
version: 2
project_name: galaxy

before:
  hooks:
    - go run ./scripts/gendocs --dir dist/docsgen

builds:
  - main: ./cmd/galaxy
    binary: galaxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: "386"
    ldflags:
      - -s -w
      - -X github.com/oxmonty/galaxy-cli/cmd/galaxy.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - license*
      - readme*
      - changelog*
      - src: dist/docsgen/man/*
        dst: man
      - src: dist/docsgen/completions/*
        dst: completions

checksum:
  name_template: checksums.txt

changelog:
  disable: true # release-please owns the changelog

release:
  prerelease: auto

# two channels mirroring npm's dist-tags: galaxy-cli tracks stable
# releases only (like npm `latest`), galaxy-cli@next tracks every release
# (like npm `next`) — one prerelease channel for any maturity (alpha/beta/rc
# live in the version string)
homebrew_casks:
  # named galaxy-cli to match the npm package; the installed command stays `galaxy`
  - name: galaxy-cli
    skip_upload: auto # prerelease tags leave the stable cask untouched
    repository:
      owner: oxmonty
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    binaries: [galaxy] # cask is named galaxy-cli; the archive's binary is not
    # every listed page must exist in dist/docsgen/man — one per top-level command
    manpages:
      - man/galaxy.1
      - man/galaxy-auth.1
      - man/galaxy-celestial-bodies.1
      - man/galaxy-me.1
      - man/galaxy-planets.1
      - man/galaxy-user.1
    completions:
      bash: completions/galaxy.bash
      zsh: completions/_galaxy
      fish: completions/galaxy.fish
    caveats: |
      Installed command: galaxy   (stable channel)

        Get started:          galaxy --help
        Upgrade:              brew upgrade galaxy-cli
        Prerelease channel:   brew uninstall --cask galaxy-cli && brew install oxmonty/tap/galaxy-cli@next

      Conflicts with galaxy-cli@next (both install `galaxy`) — keep only one.
    homepage: https://github.com/oxmonty/galaxy-cli
    description: "Scalar Galaxy"
    # unsigned binaries: strip the quarantine attribute so macOS runs them
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/galaxy"]
          end
  - name: galaxy-cli@next
    repository:
      owner: oxmonty
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
