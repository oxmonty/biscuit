# Code generated by biscuit. DO NOT EDIT.
version: 2
project_name: petstore

before:
  hooks:
    - go run ./scripts/gendocs --dir dist/docsgen

builds:
  - main: ./cmd/petstore
    binary: petstore
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: "386"
    ldflags:
      - -s -w
      - -X github.com/oxmonty/petstore-cli/cmd/petstore.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - license*
      - readme*
      - changelog*
      - src: dist/docsgen/man/*
        dst: man
      - src: dist/docsgen/completions/*
        dst: completions

checksum:
  name_template: checksums.txt

changelog:
  disable: true # release-please owns the changelog

release:
  prerelease: auto

# two channels mirroring npm's dist-tags: petstore-cli tracks stable
# releases only (like npm `latest`), petstore-cli@next tracks every release
# (like npm `next`) — one prerelease channel for any maturity (alpha/beta/rc
# live in the version string)
homebrew_casks:
  # named petstore-cli to match the npm package; the installed command stays `petstore`
  - name: petstore-cli
    skip_upload: auto # prerelease tags leave the stable cask untouched
    repository:
      owner: oxmonty
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    binaries: [petstore] # cask is named petstore-cli; the archive's binary is not
    # every page GenManTree emits, nested commands included — a partial list
    # would leave `man petstore-<sub>-<verb>` unresolvable after install
    manpages:
      - man/petstore-pets-create.1
      - man/petstore-pets-list.1
      - man/petstore-pets-show.1
      - man/petstore-pets.1
      - man/petstore.1
    completions:
      bash: completions/petstore.bash
      zsh: completions/_petstore
      fish: completions/petstore.fish
    caveats: |
      Installed command: petstore   (stable channel)

        Get started:          petstore --help
        Upgrade:              brew upgrade petstore-cli
        Prerelease channel:   brew uninstall --cask petstore-cli && brew install oxmonty/tap/petstore-cli@next

      Conflicts with petstore-cli@next (both install `petstore`) — keep only one.
    homepage: https://github.com/oxmonty/petstore-cli
    description: "Swagger Petstore"
    # unsigned binaries: strip the quarantine attribute so macOS runs them
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/petstore"]
          end
  - name: petstore-cli@next
    repository:
      owner: oxmonty
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    binaries: [petstore]
    manpages:
      - man/petstore-pets-create.1
      - man/petstore-pets-list.1
      - man/petstore-pets-show.1
      - man/petstore-pets.1
      - man/petstore.1
    completions:
      bash: completions/petstore.bash
      zsh: completions/_petstore
      fish: completions/petstore.fish
    caveats: |
      Installed command: petstore   (prerelease channel — alpha/beta/rc builds)

        Get started:        petstore --help
        Upgrade:            brew upgrade petstore-cli@next
        Switch to stable:   brew uninstall --cask petstore-cli@next && brew install oxmonty/tap/petstore-cli

      Conflicts with the stable petstore-cli cask (both install `petstore`) — keep only one.
    homepage: https://github.com/oxmonty/petstore-cli
    description: "Swagger Petstore (prerelease channel)"
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/petstore"]
          end
